# Local development infrastructure for Ymer.
# The backend and frontend run on the host (see DEVELOPMENT.md); this file
# provides the stateful services they depend on.

name: ymer

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ymer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymer}
      POSTGRES_DB: ${POSTGRES_DB:-ymer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. The official minio/minio image is no longer
  # published on Docker Hub; pgsty/minio is a community build of MinIO from source
  # (same CLI and API). Override with MINIO_IMAGE in .env.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ymer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ymer-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the application bucket once MinIO is healthy.
  # (`flask --app wsgi init-storage` does the same from the backend.)
  minio-init:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ymer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ymer-dev-secret}
      S3_BUCKET: ${YMER_S3_BUCKET:-ymer}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
