<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ymer</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; --brand: #4f46e5; --brand-text: #fff; --error: #e11d48; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #121933; --text: #f4f4f5; --muted: #a1a1aa; --line: #27304d; --brand: #6366f1; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-text); font: inherit; font-weight: 600; cursor: pointer; }
    .error { color: var(--error); min-height: 1.5em; margin: 8px 0 0; font-size: 14px; }
    .hint { margin: 16px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to Ymer</h1>
    <p>Enter the address of your Ymer server, the one you open in a browser.</p>
    <form id="form" novalidate>
      <label for="url">Server address</label>
      <input id="url" type="url" placeholder="http://ymer.lan:8080" autocomplete="url" required autofocus>
      <div class="error" id="error" role="alert"></div>
      <button type="submit">Connect</button>
    </form>
    <p class="hint">Running Ymer on this computer with the Ymer server installer? Use http://localhost:8080. Change the server later from the Server menu.</p>
  </main>
  <script>
    const KEY = "ymer.server";
    const input = document.getElementById("url");
    const error = document.getElementById("error");
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch { /* storage unavailable */ }
    const changing = new URLSearchParams(location.search).has("change");
    if (saved && !changing) location.replace(saved);
    if (saved) input.value = saved;

    function normalize(raw) {
      let text = raw.trim();
      if (!text) throw new Error("Enter the server address.");
      if (!/^[a-z]+:\/\//i.test(text)) text = "http://" + text;
      const url = new URL(text);
      if (url.protocol !== "http:" && url.protocol !== "https:") throw new Error("Use an http:// or https:// address.");
      return url.origin + "/";
    }

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      try {
        const url = normalize(input.value);
        try { localStorage.setItem(KEY, url); } catch { /* remembered for this session only */ }
        location.assign(url);
      } catch (e) {
        error.textContent = e instanceof TypeError ? "That is not a valid address." : e.message;
      }
    });
  </script>
</body>
</html>
