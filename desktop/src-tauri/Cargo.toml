[package]
name = "ymer-desktop"
version = "0.1.0-beta.1"
description = "Ymer desktop client"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
