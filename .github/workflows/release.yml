# Builds a Ymer release when a version tag is pushed.
#
#   python scripts/version.py set 0.1.0-beta.1   # bump every manifest
#   git commit -am "Release 0.1.0-beta.1" && git tag v0.1.0-beta.1 && git push --follow-tags
#
# The tag must equal v<VERSION>. Pre-release versions (alpha, beta, rc) become
# GitHub pre-releases. Every release starts as a draft, so you can read the
# notes and try the files before publishing it.
#
# What a release contains:
#   - Docker images ghcr.io/<owner>/ymer-{api,collab,web}:<version> (amd64 + arm64)
#   - ymer-server-<version>.tar.gz/.zip: the Compose bundle with ymerctl
#   - ymer_<version>_all.deb: the bundle as a systemd service (Debian, Ubuntu)
#   - Ymer-Setup-<version>.exe: the bundle for Windows with Docker Desktop
#   - Ymer desktop client: .msi and -setup.exe (Windows), .dmg (macOS), .AppImage/.deb/.rpm (Linux)
#   - Ymer for Android: an .apk to install directly and an .aab for Google Play
#   - Ymer for iOS (opt-in, needs a macOS runner): an .ipa, plus a Simulator build
#   - the backend wheel and sdist, frontend static files, collab and source tarballs
#   - SHA256SUMS for all of them
#
# Pull requests that touch packaging run every build (images are built but not
# pushed) plus a smoke test of the bundle. To run manually, start from the current
# branch and enter the existing version tag to build it and create the draft.
#
# Phone apps (desktop/src-tauri with tauri.android.conf.json / tauri.ios.conf.json):
#   - Android builds on Linux every time. With the ANDROID_KEYSTORE_BASE64,
#     ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets it is signed with that key
#     (keep it: Play and installed apps only accept updates signed the same way);
#     without them it is signed with a throwaway test key so it still installs.
#   - iOS needs macOS, so it only runs when asked: tick "Build the iOS app" when
#     running the workflow by hand, or set the repository variable YMER_IOS_BUILD to
#     true for tag builds. With the APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8
#     and APPLE_DEVELOPMENT_TEAM secrets the .ipa is signed for App Store Connect
#     (TestFlight); without them it is unsigned. A missing or cancelled iOS build
#     never holds up the release.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/**"
      - "scripts/version.py"
      - "VERSION"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and draft (for example, v0.1.0-beta.2)
        required: true
        type: string
      ios:
        description: Build the iOS app (needs a macOS runner)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  IS_RELEASE: ${{ github.ref_type == 'tag' || inputs.tag != '' }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - name: Manual run needs an existing tag
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist. Create and push it first: git tag $TAG && git push origin $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Manifests match VERSION and the release tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/version.py check --tag "$RELEASE_TAG"
          else
            python scripts/version.py check
          fi
      - id: v
        run: |
          echo "version=$(python scripts/version.py)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python scripts/version.py prerelease)" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ymer" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test
    needs: version
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # A throwaway database for the tests: no password needed.
        env:
          POSTGRES_USER: ymer
          POSTGRES_DB: ymer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ymer -d ymer"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Create the test database and extensions
        env:
          PGHOST: localhost
          POSTGRES_USER: ymer
          POSTGRES_DB: ymer
        run: sh infra/postgres/init/01-init.sh
      - name: Install
        run: |
          cp .env.example .env
          cd backend && uv venv --python 3.12 .venv && uv pip install -p .venv -e '.[dev]'
          cd ../collab && npm ci
          cd ../frontend && npm ci
      - run: make lint
      - run: make test

  build:
    name: Build source artifacts
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Backend wheel and source distribution
        run: uv build backend --out-dir dist
      - name: Frontend (static files)
        run: |
          cd frontend && npm ci && npm run build
          tar -czf "../dist/ymer-frontend-$VERSION.tar.gz" -C dist --transform "s,^\.,ymer-frontend-$VERSION," .
      - name: Collaboration server (source, run with Node 22.18+)
        run: |
          git archive --format=tar.gz --prefix="ymer-collab-$VERSION/" \
            -o "dist/ymer-collab-$VERSION.tar.gz" HEAD collab
      - name: Full source
        run: git archive --format=tar.gz --prefix="ymer-$VERSION/" -o "dist/ymer-$VERSION-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: dist-core
          path: dist/
          retention-days: 7

  server-packages:
    name: Server bundle and .deb
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - run: packaging/build.sh bundle && packaging/build.sh deb
      - name: Check the .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: dist-server
          path: dist/
          retention-days: 7

  images:
    name: Image ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, collab, web]
    env:
      TAG: ${{ needs.version.outputs.image_prefix }}-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub container registry
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          tags="$TAG:${{ needs.version.outputs.version }}"
          if [ "${{ needs.version.outputs.prerelease }}" = false ]; then tags="$tags,$TAG:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/${{ matrix.image }}.Dockerfile
          # Pull requests build for amd64 only, to keep them quick.
          platforms: ${{ env.IS_RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    name: Smoke-test the bundle
    needs: [version, server-packages]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      YMER_IMAGE_PREFIX: ymer-ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Build the images locally
        run: |
          for image in api collab web; do
            docker build -q -t "$YMER_IMAGE_PREFIX-$image:$VERSION" -f "packaging/docker/$image.Dockerfile" .
          done
      - uses: actions/download-artifact@v8
        with:
          name: dist-server
          path: dist
      - name: Start bundle with default registration
        run: |
          mkdir run
          tar -C run -xzf "dist/ymer-server-$VERSION.tar.gz"
          cd "run/ymer-server-$VERSION"
          ./ymerctl start
          ./ymerctl status
      - run: python3 packaging/smoke.py http://localhost:8080 --save-state smoke-state.json
      - name: Back up, wipe all data, restore and check it came back
        run: |
          cd "run/ymer-server-$VERSION"
          echo 'YMER_BACKUP_PASSPHRASE=ci passphrase' >> ymer.env
          ./ymerctl backup
          ./ymerctl compose down -v
          ./ymerctl start
          ./ymerctl restore backups/ymer-backup-*.tar.gz.enc --yes
          cd "$GITHUB_WORKSPACE"
          python3 packaging/smoke.py http://localhost:8080 --expect-restored smoke-state.json
          ls -l "run/ymer-server-$VERSION/backups"
      - name: Check the monitoring rules and config
        run: |
          m="$PWD/packaging/bundle/monitoring"
          docker run --rm -v "$m:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/alerts.yml
          sed 's#/etc/prometheus/alerts.yml#/m/alerts.yml#' "$m/prometheus.yml" > prometheus-ci.yml
          docker run --rm -v "$m:/m:ro" -v "$PWD/prometheus-ci.yml:/p.yml:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config --syntax-only /p.yml
          python3 -c "import json; json.load(open('$m/grafana/dashboards/ymer.json'))"
      - run: ./run/ymer-server-"$VERSION"/ymerctl stop
      - name: Start fresh private bundle and verify both owners
        env:
          COMPOSE_PROJECT_NAME: ymer-private-smoke
          YMER_HTTP_PORT: "8081"
        run: |
          mkdir private
          tar -C private -xzf "dist/ymer-server-$VERSION.tar.gz"
          bundle="private/ymer-server-$VERSION"
          "$bundle/ymerctl" init
          echo 'YMER_REGISTRATION_ENABLED=false' >> "$bundle/ymer.env"
          "$bundle/ymerctl" start
          python3 packaging/smoke.py http://localhost:8081 --private-bundle "$bundle"
      - name: Logs
        if: failure()
        run: |
          for dir in run private; do
            bundle="$dir/ymer-server-$VERSION"
            if [ -f "$bundle/ymer.env" ]; then
              if [ "$dir" = private ]; then export COMPOSE_PROJECT_NAME=ymer-private-smoke; fi
              "$bundle/ymerctl" compose logs --no-color
            fi
          done

  windows-setup:
    name: Windows Setup.exe
    needs: [version, server-packages]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-server
          path: server
      - name: Unpack the bundle
        shell: pwsh
        run: |
          Expand-Archive "server/ymer-server-$env:VERSION.zip" -DestinationPath staged
          Move-Item "staged/ymer-server-$env:VERSION" bundle
      - name: Check ymerctl.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\bundle\ymerctl.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $env:YMER_ENV_FILE = "$env:RUNNER_TEMP\ymer.env"
          powershell -NoProfile -ExecutionPolicy Bypass -File bundle\ymerctl.ps1 init
          $text = Get-Content $env:YMER_ENV_FILE -Raw
          if ($text -notmatch "(?m)^YMER_SECRET_KEY=[0-9a-f]{64}$") { $text; throw "init did not write a secret" }
          powershell -NoProfile -ExecutionPolicy Bypass -File bundle\ymerctl.ps1 url
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" `
            "/DBundleDir=$PWD\bundle" "/DOutputDir=$PWD\dist" packaging\windows\ymer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install silently and check the files
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "dist\Ymer-Setup-$env:VERSION.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $app = "$env:LOCALAPPDATA\Programs\Ymer"
          foreach ($f in "compose.yaml", "ymerctl.ps1", "ymer.env", "unins000.exe") {
            if (-not (Test-Path "$app\$f")) { throw "missing $f after install" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ymer\Start Ymer.lnk")) { throw "no Start menu shortcut" }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/
          retention-days: 7

  desktop:
    name: Desktop client (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-2022
            args: ""
          - name: macOS
            os: macos-15
            args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run icons
          npx tauri build --ci ${{ matrix.args }}
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          # "Ymer Desktop_0.1.0-beta.1_x64-setup.exe" -> "Ymer-Desktop-0.1.0-beta.1_x64-setup.exe"
          cd dist && for f in *; do mv "$f" "Ymer-Desktop-${f#*_}"; done && ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop-${{ matrix.name }}
          path: dist/
          retention-days: 7

  android:
    name: Android app
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Caches Gradle and its downloaded plugins between runs.
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Relay tests
        working-directory: desktop/src-tauri
        run: cargo test -p ymer-relay --locked
      - name: Signing key
        working-directory: desktop/src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            alias="$ANDROID_KEY_ALIAS"; pass="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the Android app is signed with a throwaway test key."
            alias=ymer-test; pass="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pass" -keypass "$pass" \
              -dname "CN=Ymer test build"
          fi
          printf 'storeFile=%s\nkeyAlias=%s\npassword=%s\n' "$RUNNER_TEMP/upload.jks" "$alias" "$pass" > keystore.properties
      - name: Build
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npm run icons
          # Gradle downloads its plugins from Maven Central, which sometimes answers 429
          # (rate limited). Rust is already built by then, so a second try is cheap.
          build() { npx tauri android build --ci --apk --aab --target aarch64 --target armv7 --target x86_64; }
          build || { echo "::warning::Android build failed, retrying once in 60 s"; sleep 60; build; }
      - name: Check and collect the packages
        run: |
          mkdir -p dist
          out=desktop/src-tauri/gen/android/app/build/outputs
          apk=$(find "$out/apk" -name '*-release.apk' | head -n1)
          aab=$(find "$out/bundle" -name '*-release.aab' | head -n1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | tee badging.txt | head -n3
          grep -q "package: name='app.ymer.mobile'" badging.txt
          code=$(python3 scripts/version.py android-code)
          grep -q "versionCode='$code'" badging.txt
          cp "$apk" "dist/Ymer-Android-$VERSION.apk"
          cp "$aab" "dist/Ymer-Android-$VERSION.aab"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/
          retention-days: 7

  ios:
    name: iOS app
    needs: version
    if: inputs.ios || vars.YMER_IOS_BUILD == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Generate the Xcode project
        working-directory: desktop
        run: |
          npm ci
          npx tauri ios init --ci
          npm run icons
      - name: Build
        working-directory: desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          mkdir -p ../dist
          if [ -n "$APPLE_API_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            npx tauri ios build --ci --target aarch64 --export-method app-store-connect
          else
            echo "::warning::No Apple signing secrets: the iOS app is unsigned (Simulator, or sideloading after re-signing)."
            # Missing secrets arrive as empty strings, which Tauri reads as incomplete credentials.
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_KEY_PATH APPLE_DEVELOPMENT_TEAM
            npx tauri ios build --ci --target aarch64 --no-sign
          fi
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          cp "$ipa" "../dist/Ymer-iOS-$VERSION.ipa"
          npx tauri ios build --ci --target aarch64-sim --no-sign
          app=$(find src-tauri/gen/apple/build -maxdepth 3 -path '*arm64-sim*' -name '*.app' | head -n1)
          (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/dist/Ymer-iOS-Simulator-$VERSION.zip" "$(basename "$app")")
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-ios
          path: dist/
          retention-days: 7

  release:
    name: Draft GitHub release
    # The desktop builds may be cancelled without failing (macOS runners are not
    # available on every account); the release then ships without those files.
    # The iOS build is optional too: skipped unless asked for, and a cancelled run
    # (no macOS runner) does not block the release. A failed one does.
    if: >-
      always() && needs.version.result == 'success' && needs.test.result == 'success'
      && needs.build.result == 'success' && needs.server-packages.result == 'success'
      && needs.images.result == 'success' && needs.smoke.result == 'success'
      && needs.windows-setup.result == 'success'
      && (needs.desktop.result == 'success' || needs.desktop.result == 'cancelled')
      && needs.android.result == 'success'
      && needs.ios.result != 'failure'
      && needs.version.outputs.release_tag != ''
    needs: [version, test, build, server-packages, images, smoke, windows-setup, desktop, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "CHANGELOG.md has no notes for $VERSION; GitHub will generate them."
      - name: Create the draft release
        run: |
          pre=""
          [ "${{ needs.version.outputs.prerelease }}" = true ] && pre="--prerelease"
          notes=(--generate-notes)
          grep -q '[^[:space:]]' notes.md && notes=(--notes-file notes.md)
          gh release create "$RELEASE_TAG" dist/* --draft $pre \
            --title "Ymer $VERSION" "${notes[@]}"
