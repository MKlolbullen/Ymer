# Written by Ymer Factory: the checks Ymer runs before every release (lint, build,
# tests and a smoke run), using the scripts in .ymer-ci/. Edit freely.
name: Ymer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pytest==8.3.3 ruff==0.8.4 && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint
        run: sh .ymer-ci/lint.sh
      - name: Build
        run: sh .ymer-ci/build.sh
      - name: Tests
        run: sh .ymer-ci/test.sh
      - name: Smoke run
        run: sh .ymer-ci/smoke.sh
