[project]
name = "ymer"
version = "0.1.0"
description = "Ymer backend: Flask API for the multi-user creator platform"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "flask-cors>=5.0",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "cryptography>=43",
  "pyjwt>=2.10",
  "email-validator>=2.2",
  "pycrdt>=0.12",
  "anthropic>=2.13",
]

[project.optional-dependencies]
# Hosted build sandbox for the Factory (YMER_FACTORY_SANDBOX=modal).
modal = ["modal>=1.6"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ymer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "db: test needs a reachable Postgres (YMER_TEST_DATABASE_URL); skipped otherwise",
  "live: test uses real services (MinIO, Docker, a git server); skipped when they are missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
