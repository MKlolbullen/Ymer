# One origin for the browser: the app, the API, the collab WebSocket and file downloads.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Keep the request id a proxy in front of us assigned (Caddy), else make one. The API
# echoes it in X-Request-ID and writes it to its logs.
map $http_x_request_id $ymer_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Append to the X-Forwarded-Proto a proxy in front of us (Caddy) sent instead of replacing
# it, so the API sees "https" with YMER_TRUSTED_PROXIES=2. With 1 it reads only the last
# value, which nginx sets, so a client cannot fake it.
map $http_x_forwarded_proto $ymer_forwarded_proto {
    ""      $scheme;
    default "$http_x_forwarded_proto, $scheme";
}

# Docker's embedded DNS, so upstreams are looked up per request and a restarted
# container's new address is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped by the API (YMER_MAX_UPLOAD_BYTES, YMER_MAX_IMPORT_BYTES).
    client_max_body_size 110m;

    set $api http://api:5000;
    set $collab http://collab:1234;
    set $storage http://minio:9000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ymer_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $ymer_request_id;
        # AI requests and Factory actions can take minutes.
        proxy_read_timeout 300s;
    }

    location /collab {
        rewrite ^/collab/?(.*)$ /$1 break;
        proxy_pass $collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Presigned download links are signed for this host, so pass it through unchanged.
    location ^~ /ymer-files/ {
        proxy_pass $storage;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # The service worker and the app shell must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prometheus metrics are for the internal network only.
    location = /metrics {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
