# One origin for the browser: the app, the API, the collab WebSocket and file downloads.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Docker's embedded DNS, so upstreams are looked up per request and a restarted
# container's new address is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped by the API (YMER_MAX_UPLOAD_BYTES, YMER_MAX_IMPORT_BYTES).
    client_max_body_size 110m;

    set $api http://api:5000;
    set $collab http://collab:1234;
    set $storage http://minio:9000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # AI requests and Factory actions can take minutes.
        proxy_read_timeout 300s;
    }

    location /collab {
        rewrite ^/collab/?(.*)$ /$1 break;
        proxy_pass $collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Presigned download links are signed for this host, so pass it through unchanged.
    location ^~ /ymer-files/ {
        proxy_pass $storage;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # The service worker and the app shell must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
