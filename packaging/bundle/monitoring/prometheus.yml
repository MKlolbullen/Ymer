# Prometheus for a Ymer server (compose profile "monitoring"). Everything is scraped
# over the Docker network; none of these endpoints are published.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ymer-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]

  - job_name: ymer-collab
    metrics_path: /metrics
    static_configs:
      - targets: ["collab:1234"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
