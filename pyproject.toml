[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcounter"
version = "0.1.0"
description = "Count words, lines and characters in a text file and list the most common words."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wc-py = "app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
